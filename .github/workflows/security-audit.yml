name: Bağımlılık güvenliği

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GPUI_REPOSITORY: hakantr/gpui
  GPUI_REVISION: 981b10eb6da5621c3ba0b456dba82609da1ab550

jobs:
  security_audit:
    name: RustSec güvenlik denetimi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barcoders
    steps:
      - name: Barcoders deposunu al
        uses: actions/checkout@v6
        with:
          path: barcoders

      - name: Yerel GPUI kaynağını al
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GPUI_REPOSITORY }}
          ref: ${{ env.GPUI_REVISION }}
          path: gpui

      - name: Denetim kilit dosyasını üret
        run: cargo generate-lockfile

      - name: Bilinen güvenlik açıklarını denetle
        # Bu resmî commit, henüz etiketlenmeyen Node.js 24 geçişini içerir.
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: barcoders
          # Bu üç bakım bildirimi, bugün yayımlanmış son sürümlere aittir. Yerlerine geçecek sürüm
          # bulunmadığından yalnız bu kimlikler kabul edilir; yeni güvenlik kayıtları raporlanır.
          ignore: RUSTSEC-2024-0436,RUSTSEC-2026-0206,RUSTSEC-2026-0192
