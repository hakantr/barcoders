name: Bağımlılık güvenliği

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_audit:
    name: RustSec güvenlik denetimi
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Bilinen güvenlik açıklarını denetle
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
