name: Sürekli entegrasyon

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GPUI_REPOSITORY: hakantr/gpui
  GPUI_REVISION: 981b10eb6da5621c3ba0b456dba82609da1ab550
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Biçim, Clippy ve belgeler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barcoders
    steps:
      - name: Barcoders deposunu al
        uses: actions/checkout@v6
        with:
          path: barcoders

      - name: Yerel GPUI kaynağını al
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GPUI_REPOSITORY }}
          ref: ${{ env.GPUI_REVISION }}
          path: gpui

      - name: Araç zincirini göster
        run: rustc --version --verbose

      - name: GPUI'nin yalnızca path kaynağından geldiğini doğrula
        run: >-
          cargo metadata --format-version 1 |
          jq -e '.packages[] |
          select(.name == "gpui" and .source == null and
          (.manifest_path | endswith("/gpui/crates/gpui/Cargo.toml")))' >/dev/null

      - name: Biçimi denetle
        run: cargo fmt --all -- --check

      - name: Clippy kurallarını denetle
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: API belgelerini derle
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Belge örneklerini sına
        run: cargo test --doc --all-features

  platform_tests:
    name: Rust 1.95 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: barcoders
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Barcoders deposunu al
        uses: actions/checkout@v6
        with:
          path: barcoders

      - name: Yerel GPUI kaynağını al
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GPUI_REPOSITORY }}
          ref: ${{ env.GPUI_REVISION }}
          path: gpui

      - name: Tüm özellikleri ve hedefleri sına
        run: cargo test --all-features --all-targets

  feature_checks:
    name: Özellik kapsamı / ${{ matrix.label }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barcoders
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: varsayılan
            arguments: ""
          - label: yalnız çekirdek no_std
            arguments: --no-default-features
          - label: no_std üreteçleri
            arguments: --no-default-features --features ascii,json,svg
          - label: görüntü stdyi etkinleştirir
            arguments: --no-default-features --features image
          - label: yerel GPUI stdyi etkinleştirir
            arguments: --no-default-features --features gpui
    steps:
      - name: Barcoders deposunu al
        uses: actions/checkout@v6
        with:
          path: barcoders

      - name: Yerel GPUI kaynağını al
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GPUI_REPOSITORY }}
          ref: ${{ env.GPUI_REVISION }}
          path: gpui

      - name: Özellik birleşimini denetle
        run: cargo check --lib ${{ matrix.arguments }}

  current_stable:
    name: Güncel kararlı Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barcoders
    steps:
      - name: Barcoders deposunu al
        uses: actions/checkout@v6
        with:
          path: barcoders

      - name: Yerel GPUI kaynağını al
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GPUI_REPOSITORY }}
          ref: ${{ env.GPUI_REVISION }}
          path: gpui

      - name: Güncel kararlı araç zincirini kur
        run: rustup update stable --no-self-update

      - name: Güncel kararlı Rust ile sına
        run: cargo +stable test --all-features --all-targets
