version: 2

updates:
  # Cargo bağımlılıkları, repo dışında tutulan ../gpui path bağımlılığı nedeniyle RustSec işinde
  # denetlenir. Dependabot yalnız başına kardeş depoyu alamadığı için bu ekosistem burada kapalıdır.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
