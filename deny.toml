[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[licenses.private]
# Yerel GPUI çalışma alanındaki yayımlanmayan yardımcı crate'ler lisans üstverisi taşımıyor.
# Dış kayıt kaynaklarından gelen bütün bağımlılıklar yukarıdaki izin listesine tabi kalır.
ignore = true
