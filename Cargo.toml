[package]
name = "barcoders"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Andrew Buntine <info@bunts.io>"]
description = "Rust için barkod kodlama kütüphanesi"
homepage = "https://github.com/buntine/barcoders"
repository = "https://github.com/buntine/barcoders"
documentation = "https://docs.rs/barcoders"
readme = "README.md"
keywords = ["barcode", "barcodes", "barcode-encoding"]
license = "MIT OR Apache-2.0"
exclude = [
    "media/*",
    "TODO",
]

[features]
default = ["ascii", "json", "svg", "std"]
ascii = []
json = []
svg = []
image = ["dep:image"]
std = []

[dependencies.image]
version = "0.25"
optional = true
default-features = false
features = ["gif", "png", "webp"]

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
