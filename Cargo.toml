[package]
name = "barcoders"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Andrew Buntine <info@bunts.io>"]
description = "Rust için barkod kodlama kütüphanesi"
homepage = "https://github.com/hakantr/barcoders"
repository = "https://github.com/hakantr/barcoders"
documentation = "https://docs.rs/barcoders"
readme = "README.md"
keywords = ["barcode", "barcodes", "barcode-encoding"]
license = "MIT OR Apache-2.0"
exclude = [
    "media/*",
    "TODO",
]

[features]
default = ["ascii", "json", "svg", "std"]
ascii = []
gpui = ["std", "dep:gpui"]
json = []
svg = []
image = ["std", "dep:image"]
std = []

[dependencies.gpui]
path = "../gpui/crates/gpui"
version = "=0.3.0"
optional = true
default-features = false

[dependencies.image]
version = "0.25.10"
optional = true
default-features = false
features = ["gif", "png", "webp"]

[package.metadata.docs.rs]
no-default-features = true
features = ["ascii", "image", "json", "svg", "std"]

[[example]]
name = "gpui"
required-features = ["gpui"]

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
